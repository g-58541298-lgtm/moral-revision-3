<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道德复习小达人 · 最终审校版</title><style>
:root{--ink:#29374e;--purple:#7562c9;--bg:#f6f4ff;--good:#167a59}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#fff0f6,#f0f6ff,#fff9e9);color:var(--ink);font-family:KaiTi,STKaiti,'DFKai-SB',serif;font-size:20px}button,input{font:inherit}.dropzone{border:3px dashed #9b87d8;border-radius:18px;min-height:82px;padding:14px;background:#faf8ff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.dropzone.over{background:#e9f6ef;border-color:#167a59}.wordbank{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.wordchip{background:#e9e1ff;color:#332465;border:2px solid #b4a2ec;touch-action:manipulation}.wordchip.active{background:#7562c9;color:white}.dropclear{background:#fff0e8;color:#824b31}.helpnote{font-size:.84em;color:#5c6480}button{cursor:pointer;border:0;border-radius:15px;padding:12px 17px;background:var(--purple);color:white}button.secondary{background:#f1ecff;color:#493a8c}button:disabled{opacity:.5;cursor:not-allowed}header{padding:16px max(18px,calc((100vw - 1040px)/2));background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1040px;margin:auto;padding:25px 16px 80px}.hero{border-radius:26px;background:linear-gradient(115deg,#ded3ff,#ffe3ee);padding:24px}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin-top:20px}.card,.panel{background:white;border:2px solid #ebe6fc;border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 5px 15px #b2a9c025}.card h3{margin:5px 0}.muted{color:#65718a;font-size:.86em}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.opt{width:100%;text-align:left;background:#f3f1fd;color:var(--ink);margin:5px 0;border:2px solid transparent}.opt.chosen{border-color:var(--purple);background:#e7dfff}.opt.good{border-color:var(--good)}.pill{display:inline-block;border-radius:30px;background:#fff1c9;padding:6px 13px;font-size:.82em}.notice{border-radius:14px;background:#f2f8ed;padding:12px;margin:12px 0}.error{background:#fff1ee}.small{font-size:.85em}.bar{height:12px;border-radius:10px;background:#e7e3f5;overflow:hidden}.bar>div{height:100%;background:#7c6acb}input[type=text]{padding:13px;border-radius:12px;border:2px solid #c6bce9;width:100%;max-width:420px}.steps{display:grid;gap:8px}.step{background:#f1edff;border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.step button{padding:6px 12px}.results{font-size:1.2em}a{color:#6551bc}@media(max-width:600px){body{font-size:18px}.hero h1{font-size:27px}main{padding:14px 12px 65px}.card,.panel{padding:15px}}

#print-report{display:none}
@media print{
 @page{size:A4;margin:15mm}
 body{background:white!important;color:#111!important;font-family:KaiTi,STKaiti,'DFKai-SB',serif!important;font-size:12pt}
 body>header,main#app,.no-print{display:none!important}
 #print-report{display:block!important}
 #print-report h1{text-align:center;font-size:20pt;margin:0 0 12pt}
 #print-report h2{font-size:14pt;margin:14pt 0 6pt}
 #print-report table{width:100%;border-collapse:collapse;margin:8pt 0}
 #print-report th,#print-report td{border:1px solid #555;padding:6pt;text-align:left}
 #print-report .report-item{break-inside:avoid;border-bottom:1px solid #bbb;padding:7pt 0}
 #print-report .report-item p{margin:3pt 0}
}
</style></head><body><header><strong>🌈 道德复习小达人 · 最终审校版</strong><span id="stars" class="pill">⭐ 0</span></header><main id="app"></main><section id="print-report" aria-label="最终评估报告"></section><script src="data.js"></script><script>
'use strict';const B=window.BANK,app=document.getElementById('app');let page='home',unit=0,idx=0,exam=false,answers={},submitted=false,feedback='',correctSet=new Set();const types={choice:'情境选择',fill:'价值填充',match:'配对练习',truefalse:'是非判断',decision:'行为二选一'};const stored=()=>{try{return JSON.parse(localStorage.getItem('moralV6')||'{}')}catch{return {}}};let saved=stored();saved.stars??=0;saved.completed??={};saved.exams??=[];function save(){try{localStorage.setItem('moralV6',JSON.stringify(saved))}catch(e){}document.getElementById('stars').textContent='⭐ '+saved.stars}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setHome(){page='home';render()}function current(){return exam?B.examItems:B.items.filter(q=>q.unit===unit).sort((a,b)=>{let m=B.modes[unit];return (a.type===m?-1:0)-(b.type===m?-1:0)})}function begin(u,isExam=false){exam=isExam;unit=u;idx=0;answers={};submitted=false;feedback='';correctSet=new Set();draft=null;pickedWord=null;page='quiz';render()}function nav(n){idx=n;draft=null;pickedWord=null;feedback='';render()}function render(){save();if(page==='home'){app.innerHTML=`<section class="hero"><h1>🌟 三年级道德教育 · 全年复习</h1><p>14个单元，生活化情境与多种练习形式；填充题可拖放或点选，不设简答题。最终评估使用独立题库，共100分，自动批改。</p></section><div class="row" style="margin:18px 0"><button onclick="begin(0,true)">📝 开始全年模拟评估（100分）</button><button class="secondary" onclick="showResults()">📊 我的成绩</button></div><div class="grid">${B.units.map((u,i)=>`<section class="card"><span class="pill">第${i+1}单元 · ${types[B.modes[i]]||'情境练习'}主打</span><h3>${esc(u.title)}</h3><p class="muted">${esc(u.summary)}</p><p class="small">${saved.completed[i]?'✅ 已完成':'📖 尚未完成'}</p><button onclick="begin(${i})">进入复习 →</button></section>`).join('')}</div><p class="muted">题目为依据教材单元主题编写的原创复习题，并非课本原题。进度仅保存在本机浏览器。</p>`;return}
if(page==='results'){app.innerHTML=`<button class="secondary" onclick="setHome()">← 返回首页</button><h1>📊 我的成绩</h1><div class="panel"><p>累计星星：${saved.stars}</p><p>已完成单元：${Object.keys(saved.completed).length}/14</p><h3>最近模拟成绩</h3>${saved.exams.length?saved.exams.slice(-5).reverse().map(e=>`<p>${esc(e.date)}：<strong>${e.score}/100</strong></p>`).join(''):'<p>还没有模拟评估记录。</p>'}</div>`;return}
if(page==='done'){buildReport();let score=Object.values(answers).filter(x=>x.correct).length*2;app.innerHTML=`<div class="hero"><h1>🎉 全年模拟评估完成</h1><p class="results">总分：<strong>${score} / 100</strong></p><p>共50小题，每题2分。五种题型各10题、各20分。评估使用独立题目，不重复单元练习的题干。</p></div><div class="row" style="margin:20px 0"><button onclick="setHome()">返回首页</button><button class="secondary" onclick="begin(0,true)">重新评估</button><button onclick="printReport()">🖨️ 打印评估报告 / 保存 PDF</button></div><h2>错题回顾</h2>${current().filter(q=>!answers[q.id]?.correct).map(q=>`<div class="panel"><strong>${esc(q.prompt)}</strong><p>正确答案：${esc(answerText(q)??'请查看解析')}</p><p class="muted">${esc(q.explain)}</p></div>`).join('')||'<p>全部答对，太棒了！</p>'}`;return}
let arr=current(),q=arr[idx],a=answers[q.id],has=Object.prototype.hasOwnProperty.call(answers,q.id);app.innerHTML=`<div class="row space"><button class="secondary" onclick="setHome()">← 首页</button><span class="pill">${exam?'模拟评估 · 100分':'第'+(unit+1)+'单元 · '+esc(B.units[unit].title)}</span></div><div class="panel" style="margin-top:18px"><div class="row space"><strong>第 ${idx+1} / ${arr.length} 题</strong><span class="pill">${types[q.type]||'综合练习'} · ${exam?'2分':'练习'}</span></div><div class="bar" style="margin:12px 0"><div style="width:${(idx+1)/arr.length*100}%"></div></div><h3>${esc(q.prompt).replace(/\n/g,'<br>')}</h3>${!exam?`<details class="notice"><summary>💡 解题小提示</summary><p>先找出人物遇到的情况，再想想怎样做才会照顾到自己和别人。比较各个选项，排除不合理的做法。</p></details>`:''}<div id="response">${renderInput(q,a)}</div>${!exam&&feedback?`<div class="notice ${a?.correct?'':'error'}">${esc(feedback)}${a?.correct?'<p>'+esc(q.explain)+'</p>':''}</div>`:''}<div class="row" style="margin-top:16px">${exam?`<button onclick="record()">${has?'修改答案':'保存本题答案'}</button>`:`<button onclick="record()">检查答案</button>`}<button class="secondary" onclick="nav(Math.max(0,idx-1))" ${idx===0?'disabled':''}>上一题</button><button class="secondary" onclick="nav(Math.min(${arr.length-1},idx+1))" ${idx===arr.length-1?'disabled':''}>下一题 →</button></div>${exam?`<p class="muted">已作答 ${Object.keys(answers).length}/${arr.length} 题；可随时返回修改。</p><button onclick="finishExam()" style="background:#167a59">交卷并自动评分</button>`:`<p class="muted">答错可以重新作答，答对后获得一颗星星。</p>${idx===arr.length-1?'<button class="secondary" onclick="finishUnit()">完成本单元</button>':''}`}</div>`}
function renderInput(q,a){let v=a?.value;if(q.type==='fill')return `<p class="helpnote">把下方词语拖进空格，或点击词语再点击空格。手机和平板也能直接点选。</p><div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="答案空格" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropWord(event)" onclick="placePicked()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();placePicked()}">${esc(draft??v??'请选择词语')}</div><div class="wordbank">${q.options.map((s,i)=>`<button type="button" class="wordchip ${pickedWord===i?'active':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}');pickedWord=${i}" onclick="selectWord(${i})">${esc(s)}</button>`).join('')}</div><button class="dropclear" type="button" onclick="clearWord()">清除答案</button>`;let options=q.type==='truefalse'?['正确','错误']:q.options;return options.map((s,i)=>`<button class="opt ${v===i?'chosen':''}" onclick="choose(${i})">${(q.type==='choice'||q.type==='decision')?String.fromCharCode(65+i)+'. ':''}${esc(s)}</button>`).join('')}
let draft=null;let pickedWord=null;function selectWord(i){pickedWord=i;placePicked()}function placePicked(){if(pickedWord===null)return;let q=current()[idx];draft=q.options[pickedWord];pickedWord=null;document.getElementById('response').innerHTML=renderInput(q,{value:draft})}function dropWord(event){event.preventDefault();let i=Number(event.dataTransfer.getData('text/plain'));let q=current()[idx];if(Number.isInteger(i)&&i>=0&&i<q.options.length){pickedWord=i;placePicked()}}function clearWord(){draft='';pickedWord=null;document.getElementById('response').innerHTML=renderInput(current()[idx],{value:''})}function choose(i){draft=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('chosen',j===i))}function normalize(s){return String(s).replace(/[\s，。！!、]/g,'').trim()}function grade(q,v){if(q.type==='fill')return normalize(v)===normalize(q.answer);if(q.type==='truefalse')return v===(q.answer?0:1);return v===q.answer}function answerText(q){if(q.type==='fill')return q.answer;if(q.type==='truefalse')return q.answer?'正确':'错误';return q.options[q.answer]}function record(){let q=current()[idx],v=q.type==='fill'?(draft!==null?draft:answers[q.id]?.value):draft!==null?draft:answers[q.id]?.value;if(v===undefined||v===null||v===''){alert('请先作答。');return}let ok=grade(q,v),old=answers[q.id];answers[q.id]={value:v,correct:ok};draft=null;if(!exam){if(ok&&!correctSet.has(q.id)){correctSet.add(q.id);saved.stars++}feedback=ok?'答对了！⭐ '+answerText(q):'再想一想，留意题目中的情境，再试一次。'}render()}function finishUnit(){let arr=current();if(arr.some(q=>!answers[q.id]?.correct)){alert('还有题目未答对，可以返回继续练习。');return}saved.completed[unit]=true;save();alert('🎉 恭喜完成本单元！');setHome()}function finishExam(){if(Object.keys(answers).length<50&&!confirm('仍有题目未作答，未作答计0分。确定交卷吗？'))return;let score=Object.values(answers).filter(a=>a.correct).length*2;saved.exams.push({date:new Date().toLocaleDateString('zh-CN'),score});save();page='done';render()}function buildReport(){
 const qs=B.examItems, total=qs.length, score=qs.reduce((sum,q)=>sum+(answers[q.id]?.correct?2:0),0);
 const date=new Date().toLocaleString('zh-CN',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
 const keys=['choice','fill','match','truefalse','decision'];
 const rows=keys.map(t=>{const items=qs.filter(q=>q.type===t),got=items.filter(q=>answers[q.id]?.correct).length;return `<tr><td>${esc(types[t])}</td><td>${got}/${items.length}</td><td>${got*2}/${items.length*2}</td></tr>`}).join('');
 const wrong=qs.map((q,i)=>({q,i})).filter(x=>!answers[x.q.id]?.correct);
 const detail=wrong.length?wrong.map(({q,i})=>`<div class="report-item"><strong>第${i+1}题 · ${esc(types[q.type]||'综合练习')}</strong><p>${esc(q.prompt)}</p><p>正确答案：${esc(answerText(q)??'请参考教师讲解')}</p><p>解析：${esc(q.explain??'')}</p></div>`).join(''):'<p>全部答对，表现出色！</p>';
 document.getElementById('print-report').innerHTML=`<h1>三年级道德教育 · 全年模拟评估报告</h1><p>姓名：________________　班级：____________　日期：${esc(date)}</p><p><strong>总分：${score} / 100</strong>　正确：${score/2}/${total}题</p><h2>各题型得分</h2><table><thead><tr><th>题型</th><th>答对题数</th><th>得分</th></tr></thead><tbody>${rows}</tbody></table><h2>错题与复习建议</h2>${detail}<p style="margin-top:20pt">教师签名：________________</p><p style="font-size:10pt">本报告由本机浏览器根据本次提交的答案生成；未作答题目按0分计算。</p>`;
}
function printReport(){if(page!=='done'){alert('请先完成最终模拟评估。');return}buildReport();window.print()}
function showResults(){page='results';render()}render();
</script></body></html>
